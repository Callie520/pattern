<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memory | English for Real Australia</title>
  <meta name="description" content="Review and search the English sentences you saved.">
  <meta name="theme-color" content="#1859a9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="memory">
  <header class="app-header">
    <a class="brand" href="index.html">English for Real Australia</a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="index.html">Quick Add</a>
      <a href="review.html" class="active" aria-current="page">Memory</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-intro memory-intro">
      <div>
        <p class="eyebrow">Spaced review</p>
        <h1>Memory</h1>
        <p>Review what is due today. Short, repeated contact is what makes a sentence yours.</p>
      </div>
      <button id="start-due-review-btn" class="btn primary-btn">Review due</button>
    </section>

    <section class="memory-stats" aria-label="Memory statistics">
      <button class="stat-card active" data-filter="due"><strong id="memory-due-count">0</strong><span>Due today</span></button>
      <button class="stat-card" data-filter="learning"><strong id="memory-learning-count">0</strong><span>Learning</span></button>
      <button class="stat-card" data-filter="mastered"><strong id="memory-mastered-count">0</strong><span>Mastered</span></button>
      <button class="stat-card" data-filter="all"><strong id="memory-total-count">0</strong><span>All saved</span></button>
    </section>

    <section class="panel library-panel" aria-labelledby="library-title">
      <div class="section-heading library-heading">
        <div>
          <p class="step-label">Your sentence library</p>
          <h2 id="library-title">Due today</h2>
        </div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">Search saved sentences</span>
          <input id="memory-search" type="search" placeholder="Search English or Chinese">
        </label>
      </div>
      <div id="memory-list" class="card-list"></div>
    </section>

    <section id="memory-study-container" class="study-overlay" hidden aria-live="polite"></section>
  </main>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="index.html"><span>＋</span>Quick Add</a>
    <a href="review.html" class="active" aria-current="page"><span>◴</span>Memory</a>
    <a href="settings.html"><span>⚙</span>Settings</a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
