<section class="section-header"><h1>Settings</h1><p>Set your daily Pattern Study goal and manage backups.</p></section>
<section class="settings-form">
<form id="task-settings-form" class="add-form">
<label for="setting-patterns">Daily Pattern Goal</label><input type="number" id="setting-patterns" min="0" max="50" step="1" required>
<button type="submit" class="btn">Save Settings</button>
</form>
</section>
<section class="backup-section" style="max-width:500px; margin:2rem auto; text-align:center;">
<h2>Data Backup</h2><p>You can export your progress and settings or import a backup file.</p>
<button id="export-data-btn" class="btn" style="margin-top:0.5rem;">Export Data</button>
<input type="file" id="import-data-file" accept="application/json" style="display:none;">
<button id="import-data-btn" class="btn" style="margin-top:0.5rem;">Import Data</button>
</section>
